<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Judith</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bubble.css">
<script src="speech.js" defer></script>
<script src="recorder.js" defer></script>
<script src="bubble.js" defer></script>
</head>
<body>
<main class="notch" data-state="idle">
  <header>
    <svg class="avatar" viewBox="0 0 64 64" role="img" aria-label="Judith">
      <defs><linearGradient id="sig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#5cb8ff"/></linearGradient></defs>
      <rect width="64" height="64" rx="18" fill="url(#sig)"/>
      <path d="M6 64C6 40 18 26 32 26S58 40 58 64Z" fill="#faf9ff"/>
      <g fill="none" stroke="#24203a" stroke-width="3.2"><circle cx="23" cy="44" r="7"/><circle cx="41" cy="44" r="7"/><path d="M30 44h4M16 43l-5-2M48 43l5-2"/></g>
      <circle class="eye" cx="23" cy="44" r="2" fill="#24203a"/><circle class="eye" cx="41" cy="44" r="2" fill="#24203a"/>
    </svg>
    <span class="status" id="status">Je t'écoute</span>
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <button type="button" class="icon" id="voice" aria-label="Couper la voix" aria-pressed="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path class="spk" d="M3 8v4h3l4 3V5L6 8Z"/><path class="on" d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/><path class="off" d="M13 8l4 4M17 8l-4 4"/></svg>
    </button>
    <button type="button" class="icon" id="close" aria-label="Fermer">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg>
    </button>
  </header>

  <p class="caption" id="caption" aria-live="polite" hidden></p>

  <section class="approval" id="approval" hidden>
    <p class="approval-title" id="approval-title"></p>
    <code class="approval-detail" id="approval-detail"></code>
    <div class="approval-actions">
      <button type="button" class="deny" id="deny">Non</button>
      <button type="button" class="allow" id="allow">Vas-y</button>
    </div>
  </section>
  <ol class="steps" id="steps" hidden></ol>

  <form id="form">
    <label class="sr-only" for="question">Ta question</label>
    <textarea id="question" rows="1" placeholder="Parle-moi, ou écris ici…"></textarea>
    <button type="button" class="mic" id="mic" aria-label="Parler" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg>
    </button>
    <button type="submit" class="send" aria-label="Envoyer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
    </button>
  </form>
</main>
</body>
</html>
