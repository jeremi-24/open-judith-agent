<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Bienvenue · Judith</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="onboarding.css">
<script type="module" src="onboarding.js"></script>
</head>
<body>
<!-- Rules: one idea per screen, one sentence of 5 to 10 words, a moving
     demo, no paragraph, one obvious button, "Passer" always there. -->
<header class="bar">
  <span class="brand"><img src="../../assets/icon.png" alt=""> Judith</span>
  <ol class="dots" id="dots" aria-label="Progression"></ol>
  <button type="button" class="skip" id="skip">Passer</button>
</header>

<main id="screens">
  <!-- 1. Explain (a zone on an unknown thing) and guide (numbered steps) -->
  <section class="screen" data-title="Elle explique et guide">
    <h1>Montre ton écran. Elle explique et te guide.</h1>
    <div class="duo" aria-hidden="true">
      <figure>
        <div class="notch"><img class="face" src="../../assets/icon.png" alt=""><span class="said">« C'est quoi ça ? »</span></div>
        <div class="shot photo">
          <!-- A real photo of something few people know (NASA, public domain: assets/onboarding/README.md). -->
          <img class="mystery" id="mystery" src="../../assets/onboarding/mystery.jpg" alt="">
          <span class="zone"><span class="zone-tag">Zone partagée</span></span>
        </div>
      </figure>
      <figure>
        <div class="notch"><img class="face" src="../../assets/icon.png" alt=""><span class="said late">« Améliore mon profil »</span></div>
        <div class="shot profile">
          <div class="cover"></div>
          <span class="avatar"></span>
          <div class="who"><i class="name"></i><i class="headline"></i><i class="place"></i></div>
          <span class="edit">Enregistrer</span>
          <div class="about"><i></i><i></i><i></i></div>
          <span class="num n1"><b>1</b>Ajoute ta photo de profil</span>
          <span class="num n2"><b>2</b>Écris ton métier en une ligne</span>
          <span class="num n3"><b>3</b>Clique sur Enregistrer</span>
          <span class="hl h1"></span><span class="hl h2"></span><span class="hl h3"></span>
        </div>
      </figure>
    </div>
  </section>

  <!-- 2. Another zone: the first one stays, as a numbered thumbnail -->
  <section class="screen" data-title="Plusieurs zones" hidden>
    <h1>Une autre zone&nbsp;? La&nbsp;première reste à&nbsp;côté.</h1>
    <figure class="solo" aria-hidden="true">
      <div class="notch"><img class="face" src="../../assets/icon.png" alt=""><span class="said late">« Compare les deux »</span></div>
      <div class="shot photo multi">
        <img class="mystery" src="../../assets/onboarding/mystery.jpg" alt="">
        <span class="zone z1"><b class="zbadge">1</b></span>
        <span class="zone z2"><b class="zbadge">2</b></span>
        <div class="tray">
          <span class="thumb t1"><b class="zbadge">1</b></span>
          <span class="thumb t2"><b class="zbadge">2</b></span>
        </div>
      </div>
    </figure>
  </section>

  <!-- 3. Understanding fast: a long message, and what it comes down to -->
  <section class="screen" data-title="Elle comprend vite" hidden>
    <h1>Un long message&nbsp;? Compris en une phrase.</h1>
    <figure class="solo" aria-hidden="true">
      <div class="notch"><img class="face" src="../../assets/icon.png" alt=""><span class="said">« Résume-moi ça »</span></div>
      <div class="shot mail">
        <div class="mail-head"><span class="sender"></span><div><b>Ta cheffe</b><i>Rapport du mois</i></div></div>
        <p class="mail-body">Bonjour, suite à la réunion, j'ai besoin du <mark data-n="1">rapport de ventes d'octobre</mark> avant la fin de la semaine. Peux-tu le finaliser <mark data-n="2">pour vendredi 14&nbsp;h</mark> et <mark data-n="3">l'envoyer à Marc</mark>, en me mettant en copie&nbsp;? Dis-moi si un chiffre te manque. Je compte sur toi pour la présentation de lundi. Merci&nbsp;!</p>
        <div class="answer">
          <div class="answer-head"><img class="face" src="../../assets/icon.png" alt="">En clair</div>
          <ol>
            <li><b>1</b>Le rapport de ventes d'octobre</li>
            <li><b>2</b>À rendre vendredi, 14&nbsp;h</li>
            <li><b>3</b>À envoyer à Marc, elle en copie</li>
          </ol>
        </div>
      </div>
    </figure>
  </section>

  <!-- 4. Connect an AI: the labels say what to pick -->
  <section class="screen" data-title="Ton IA" hidden>
    <h1>Connecte ton IA à Judith.</h1>
    <div class="choices" id="engines" role="radiogroup" aria-label="Ton IA"></div>
    <div class="api" id="api" hidden>
      <select id="api-provider" aria-label="Fournisseur"></select>
      <input id="api-key" type="password" autocomplete="off" placeholder="Colle ta clé (sk-…)" aria-label="Clé API">
      <button type="button" class="link" id="engine-test">Tester</button>
      <button type="button" class="link" id="get-provider-key">Obtenir une clé</button>
    </div>
    <div class="api" id="none" hidden>
      <button type="button" class="link" id="get-claude">Installer Claude Code</button>
      <button type="button" class="link" id="get-key">Clé gratuite NVIDIA</button>
      <button type="button" class="link" id="get-gemini">Clé gratuite Google Gemini</button>
    </div>
    <p class="status" id="engine-status" aria-live="polite"></p>
  </section>

  <!-- 5. Shortcut -->
  <section class="screen" data-title="Raccourci" hidden>
    <h1>Appelle-la de partout, d'un raccourci.</h1>
    <p class="keys big press" id="shortcut-keys" aria-hidden="true"></p>
    <div class="inline">
      <select id="shortcut" aria-label="Raccourci pour appeler Judith"></select>
      <label class="toggle"><input type="checkbox" id="start-windows"><span>Démarrer avec Windows</span></label>
    </div>
    <p class="status" id="shortcut-status" aria-live="polite"></p>
  </section>

  <!-- 6. Ready -->
  <section class="screen" data-title="Prête" hidden>
    <h1>Essaie maintenant, sur ton propre écran.</h1>
    <div class="stack" aria-hidden="true">
      <p class="keys big press" id="ready-keys"></p>
      <div class="notch"><img class="face" src="../../assets/icon.png" alt=""><span class="said late">« C'est quoi ça ? »</span></div>
    </div>
  </section>
</main>

<footer class="nav">
  <button type="button" class="back" id="back">Retour</button>
  <button type="button" id="next" class="primary">Découvrir</button>
</footer>
</body>
</html>
