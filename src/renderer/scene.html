<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Served from judith-frame://scene/ (src/main/frames.js) with its own CSP:
     no network, only these scripts, and eval for the model's code. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #faf9ff; font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; color: #24203a; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #lines, #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lines { overflow: visible; }
  /* Labels written by hand, in the margins, each with a line to its part. */
  .tag {
    position: absolute; left: 0; top: 0; max-width: 40%; padding: 1px 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 600 13.5px/1.25 "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
    color: #3a3552; opacity: 0; transition: opacity 0.3s 0.25s, color 0.2s;
  }
  .tag.on { opacity: 0.88; }
  .tag.active.on { opacity: 1; color: #24203a; }
  .tag.right { text-align: right; }
  .mark { opacity: 0; transition: opacity 0.2s; }
  .mark.on { opacity: 1; }
  .leader { fill: none; stroke: #3a3552; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.55s ease-out 0.1s, stroke 0.2s; }
  .mark.on .leader { stroke-dashoffset: 0; }
  .dot { fill: #3a3552; transition: fill 0.2s; }
  .mark.active .leader { stroke: #3b6cf6; }
  .mark.active .dot { fill: #3b6cf6; stroke: #fff; stroke-width: 2; r: 5px; transform-box: fill-box; transform-origin: center; animation: ping 1.5s ease-in-out infinite; }
  @keyframes ping { 50% { transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .mark.active .dot { animation: none; } .tag, .leader { transition: none; } }
  #bar {
    position: absolute; left: 8px; right: 8px; bottom: 8px;
    display: flex; align-items: center; gap: 8px;
    padding: 5px 6px 5px 12px; border-radius: 12px;
    background: rgb(20 17 29 / 0.86); color: #f4f2ff; font-size: 12px; font-weight: 600;
  }
  #bar[hidden] { display: none; }
  #caption { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #count { font: 500 10.5px "JetBrains Mono", Consolas, monospace; color: #c9c0ff; }
  #bar button { width: 24px; height: 24px; border: 0; border-radius: 8px; background: rgb(255 255 255 / 0.1); color: #f4f2ff; cursor: pointer; font-size: 13px; line-height: 1; }
  #error { position: absolute; inset: 12px; display: grid; place-items: center; text-align: center; font-size: 12.5px; color: #6b6585; }
  #error[hidden] { display: none; }
</style>
<script src="three.min.js"></script>
<script src="scene-bricks.js"></script>
<script src="scene-runtime.js"></script>
<script src="scene-boot.js" defer></script>
</head>
<body>
<canvas id="view"></canvas>
<svg id="lines" aria-hidden="true"></svg>
<div id="labels"></div>
<div id="bar" hidden>
  <button type="button" id="prev" aria-label="Étape précédente">‹</button>
  <span id="caption"></span>
  <span id="count"></span>
  <button type="button" id="next" aria-label="Étape suivante">›</button>
</div>
<p id="error" hidden>La scène 3D n'a pas pu s'afficher.</p>
</body>
</html>
